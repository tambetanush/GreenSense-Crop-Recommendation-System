<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>GreenSense - Crop Recommendation</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/static/style.css" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />
    </head>

    <body class="bg-light">
        <div class="container my-4">
            <h1 class="mb-3" style="text-align: center">
                GreenSense - Crop Recommendation
            </h1>

            <!-- GOOGLE SHEETS SECTION  -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Latest Sensor Readings</h5>

                    <button
                        class="btn btn-primary mb-3"
                        onclick="fetchReadings()">
                        Fetch Latest 3 Readings
                    </button>

                    <div class="table-responsive">
                        <table
                            class="table table-bordered table-sm"
                            id="readingsTable">
                            <thead class="table-secondary">
                                <tr>
                                    <th>Select</th>
                                    <th>Env_Temp</th>
                                    <th>BMP_Pressure</th>
                                    <th>BMP_Altitude</th>
                                    <th>Light</th>
                                    <th>DHT_Humidity</th>
                                    <th>CO₂</th>
                                    <th>CO</th>
                                    <th>NH₃</th>
                                    <th>Soil_Moisture</th>
                                    <th>Soil_Temp</th>
                                    <th>pH</th>
                                    <th>N</th>
                                    <th>P</th>
                                    <th>K</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!--  INPUT FORM  -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Farm Input Data</h5>

                    <form id="predictForm">
                        <div class="row g-4">
                            <!--  LEFT: SOIL PARAMETERS  -->
                            <div class="col-md-6">
                                <h6 class="mb-3 text-muted">Soil Parameters</h6>
                                <div class="row g-3" id="soilInputs"></div>

                                <!-- Categorical -->
                                <div class="row g-3 mt-1">
                                    <div class="col-md-12">
                                        <label class="form-label"
                                            >District</label
                                        >
                                        <select
                                            class="form-select"
                                            name="district"
                                            required>
                                            <option value="">Select</option>
                                            <option>Raigad</option>
                                            <option>Nashik</option>
                                        </select>
                                    </div>

                                    <div class="col-md-12">
                                        <label class="form-label"
                                            >Location</label
                                        >
                                        <select
                                            class="form-select"
                                            name="location"
                                            required>
                                            <option value="">Select</option>
                                            <option>Karjat</option>
                                            <option>Alibag/Mangaon</option>
                                            <option>Niphad/Yeola</option>
                                            <option>Baglan/Kalwan</option>
                                            <option>
                                                Igatpuri (Ghat Zone)
                                            </option>
                                        </select>
                                    </div>

                                    <div class="col-md-12">
                                        <label class="form-label">Season</label>
                                        <select
                                            class="form-select"
                                            name="season"
                                            required>
                                            <option value="">Select</option>
                                            <option>Summer</option>
                                            <option>Monsoon</option>
                                            <option>Winter</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!--  RIGHT ENV + LOCATION  -->
                            <div class="col-md-6">
                                <h6 class="mb-3 text-muted">
                                    Environment & Location
                                </h6>
                                <div class="row g-3" id="envInputs"></div>
                            </div>
                        </div>

                        <!--  BUTTONS  -->
                        <div class="mt-4 d-flex gap-3">
                            <button
                                type="button"
                                class="btn btn-warning"
                                onclick="randomizeAll()">
                                Randomize All
                            </button>

                            <button type="submit" class="btn btn-success">
                                Generate Recommendations
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!--  RESULT  -->
            <div class="card d-none" id="resultCard">
                <div class="card-body">
                    <h5>Recommended Crops</h5>
                    <div id="prediction-result"></div>
                </div>
            </div>
        </div>

        <!--  JAVASCRIPT  -->
        <script>
            const numericFields = [
                ["N", "Nitrogen (kg/ha)", "100-350"],
                ["P", "Phosphorus (kg/ha)", "5-80"],
                ["K", "Potassium (kg/ha)", "100-350"],
                ["pH", "Soil pH", "5.5-7.8"],
                ["Soil_Temp", "Soil Temp (°C)", "10-40"],
                ["Env_Temp", "Air Temp (°C)", "10-45"],
                ["Soil_Moisture", "Soil Moisture (%)", "20-100"],
                ["DHT_Humidity", "Air Humidity (%)", "30-100"],
                ["MQ135_CO2", "CO₂ (ppm)", "380-500"],
                ["MQ135_CO", "CO (ppm)", "0-10"],
                ["MQ135_NH3", "NH₃ (ppm)", "0-10"],
                ["BMP_Altitude", "Altitude (m)", "0-1500"],
                ["BMP_Pressure", "Pressure (hPa)", "900-1050"],
                ["Light", "Light (lux)", "10000-120000"],
            ];

            /*  Build numeric inputs  */
            const soilContainer = document.getElementById("soilInputs");
            const envContainer = document.getElementById("envInputs");

            numericFields.forEach(([name, label, range]) => {
                const html = `
    <div class="col-md-12">
        <label class="form-label">${label}
            <small class="text-muted">(${range})</small>
        </label>
        <div class="input-group">
            <input type="number" step="any" class="form-control" name="${name}">
            <button type="button"
                class="btn btn-outline-secondary"
                onclick="randomField('${name}')">🎲</button>
        </div>
    </div>`;

                // Soil fields
                if (
                    [
                        "N",
                        "P",
                        "K",
                        "pH",
                        "Soil_Temp",
                        "Soil_Moisture",
                    ].includes(name)
                ) {
                    soilContainer.innerHTML += html;
                } else {
                    envContainer.innerHTML += html;
                }
            });

            /*  Random helpers  */
            function rand(min, max) {
                return (Math.random() * (max - min) + min).toFixed(2);
            }

            const ranges = {
                N: [100, 350],
                P: [5, 80],
                K: [100, 350],
                pH: [5.5, 7.8],
                Soil_Temp: [10, 40],
                Env_Temp: [10, 45],
                Soil_Moisture: [20, 100],
                DHT_Humidity: [30, 100],
                MQ135_CO2: [380, 500],
                MQ135_CO: [0, 10],
                MQ135_NH3: [0, 10],
                BMP_Altitude: [0, 1500],
                BMP_Pressure: [900, 1050],
                Light: [10000, 120000],
            };

            function randomField(name) {
                const el = document.querySelector(`[name="${name}"]`);
                const [min, max] = ranges[name];
                el.value = rand(min, max);
            }

            function randomizeAll() {
                Object.keys(ranges).forEach(randomField);
            }

            /*  Fetch Google Sheet  */
            function fetchReadings() {
                fetch("/latest-readings")
                    .then((r) => r.json())
                    .then((data) => {
                        const tbody = document.querySelector(
                            "#readingsTable tbody"
                        );
                        tbody.innerHTML = "";
                        data.records.slice(-3).forEach((row) => {
                            const tr = document.createElement("tr");
                            tr.innerHTML = `
                    <td><button class="btn btn-sm btn-success" onclick='selectRow(${JSON.stringify(
                        row
                    )})'>Select</button></td>
                    ${row
                        .slice(2, 17)
                        .map((v) => `<td>${v}</td>`)
                        .join("")}
                `;
                            tbody.appendChild(tr);
                        });
                    });
            }

            /*  Insert selected row  */
            function selectRow(row) {
                const mapping = {
                    Env_Temp: 2,
                    BMP_Pressure: 3,
                    BMP_Altitude: 4,
                    Light: 5,
                    DHT_Humidity: 6,
                    MQ135_CO2: 7,
                    MQ135_CO: 8,
                    MQ135_NH3: 9,
                    Soil_Moisture: 10,
                    Soil_Temp: 11,
                    pH: 12,
                    N: 13,
                    P: 14,
                    K: 15,
                };

                Object.entries(mapping).forEach(([field, idx]) => {
                    const el = document.querySelector(`[name="${field}"]`);
                    if (el) {
                        el.value = row[idx];
                        el.classList.add("border-success");
                        setTimeout(
                            () => el.classList.remove("border-success"),
                            1200
                        );
                    }
                });
            }

            function displayPrediction(result) {
                const container = document.getElementById("prediction-result");
                container.innerHTML = "";

                if (
                    !result.recommendations ||
                    result.recommendations.length === 0
                ) {
                    container.innerHTML =
                        "<p class='text-muted'>No suitable crops found.</p>";
                    return;
                }

                result.recommendations.forEach((item) => {
                    const percent = (item.probability * 100).toFixed(1);

                    const row = document.createElement("div");
                    row.className = "prob-row";

                    row.innerHTML = `
            <div class="prob-label">
                ${item.crop} — ${percent}%
            </div>
            <div class="prob-bar">
                <div class="prob-fill" style="width:${percent}%"></div>
            </div>
        `;

                    container.appendChild(row);
                });
            }

            /*  Predict  */
            document
                .getElementById("predictForm")
                .addEventListener("submit", (e) => {
                    e.preventDefault();
                    const data = Object.fromEntries(new FormData(e.target));
                    fetch("/predict", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(data),
                    })
                        .then((r) => r.json())
                        .then((res) => {
                            displayPrediction(res);
                            document
                                .getElementById("resultCard")
                                .classList.remove("d-none");
                        });
                });
        </script>
    </body>
</html>
