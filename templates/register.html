<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreenSense — Create Account</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c1a11;
        --surface: #122018;
        --surface-2: #1a2e22;
        --border: #2e4e3a;
        --accent: #c8a84b;
        --green: #52c47a;
        --red: #d96a58;
        --text: #ddeae0;
        --text-muted: #6d907a;
        --mono: "IBM Plex Mono", monospace;
        --sans: "IBM Plex Sans", sans-serif;
        --serif: "Playfair Display", serif;
        --radius: 8px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(#1e3428 1px, transparent 1px),
          linear-gradient(90deg, #1e3428 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.35;
        pointer-events: none;
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 36px 32px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      }
      .logo {
        font-family: var(--serif);
        font-size: 26px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .subtitle {
        color: var(--text-muted);
        font-size: 13px;
        font-family: var(--mono);
        margin-bottom: 28px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        font-family: var(--mono);
        margin-bottom: 6px;
        letter-spacing: 0.05em;
      }
      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        outline: none;
        transition: border-color 0.18s;
      }
      input:focus {
        border-color: var(--accent);
      }
      .btn {
        width: 100%;
        padding: 11px;
        border-radius: var(--radius);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        transition: all 0.18s;
        margin-top: 4px;
      }
      .btn-primary {
        background: var(--accent);
        color: #0c1a11;
      }
      .btn-primary:hover:not(:disabled) {
        background: #d9b85a;
      }
      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-link {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-muted);
        width: 100%;
        margin-top: 8px;
      }
      .btn-link:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .msg {
        border-radius: var(--radius);
        padding: 11px 14px;
        font-size: 13px;
        font-family: var(--mono);
        margin-bottom: 16px;
        display: none;
        line-height: 1.5;
      }
      .msg.show {
        display: block;
      }
      .msg-error {
        background: rgba(217, 106, 88, 0.12);
        border: 1px solid var(--red);
        color: var(--red);
      }
      .msg-info {
        background: rgba(200, 168, 75, 0.1);
        border: 1px solid var(--accent);
        color: var(--accent);
      }
      .msg-ok {
        background: rgba(82, 196, 122, 0.1);
        border: 1px solid var(--green);
        color: var(--green);
      }
      .footer-link {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .footer-link a {
        color: var(--accent);
        text-decoration: none;
      }
      .footer-link a:hover {
        text-decoration: underline;
      }
      #verifyBox {
        display: none;
      }
      .steps {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }
      .step {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
        transition: background 0.3s;
      }
      .step.active {
        background: var(--accent);
      }
      .step.done {
        background: var(--green);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🌿 GreenSense</div>
      <div class="subtitle">Create your account</div>

      <!-- Progress steps -->
      <div class="steps">
        <div class="step active" id="step1bar"></div>
        <div class="step" id="step2bar"></div>
        <div class="step" id="step3bar"></div>
      </div>

      <!-- Registration form -->
      <div id="registerForm">
        <div id="msgBox" class="msg"></div>

        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            id="displayName"
            placeholder="Your Name"
            autocomplete="name"
          />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="username"
          />
        </div>
        <div class="form-group">
          <label
            >Password
            <small style="color: var(--text-muted)"
              >(min. 6 characters)</small
            ></label
          >
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>
        <button class="btn btn-primary" id="registerBtn" onclick="doRegister()">
          Create Account →
        </button>
      </div>

      <!-- Email verification waiting state -->
      <div id="verifyBox">
        <div class="msg msg-ok show">
          ✅ Account created! A verification email has been sent to:<br />
          <strong id="sentTo" style="color: var(--text)"></strong>
        </div>
        <div
          style="
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 16px;
          "
        >
          Please check your inbox and click the verification link.<br />
          After verifying, your account will be reviewed by an admin before you
          can sign in.
        </div>
        <button class="btn btn-primary" onclick="goToLogin()">
          Go to Sign In →
        </button>
        <button class="btn btn-link" onclick="resendVerification()">
          Resend Verification Email
        </button>
      </div>

      <div class="footer-link">
        Already have an account? <a href="/login">Sign in</a>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        sendEmailVerification,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      // ── Firebase config ── replace with your actual config values ──────────
      const firebaseConfig = {
        apiKey: "AIzaSyCTnVJ5BqJHBcqMANCrzZAcM2x_Pc6aLtE",
        authDomain: "greensense-cf89f.firebaseapp.com",
        projectId: "greensense-cf89f",
        storageBucket: "greensense-cf89f.firebasestorage.app",
        messagingSenderId: "745421882914",
        appId: "1:745421882914:web:6f49f4efd52f7a6f7bec7b",
      };
      // ────────────────────────────────────────────────────────────────────────

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      let _registeredUser = null;

      function showMsg(text, type = "error") {
        const el = document.getElementById("msgBox");
        el.textContent = text;
        el.className = `msg msg-${type} show`;
      }

      function setBtn(loading) {
        const btn = document.getElementById("registerBtn");
        btn.disabled = loading;
        btn.textContent = loading ? "Creating account…" : "Create Account →";
      }

      function setStep(n) {
        ["step1bar", "step2bar", "step3bar"].forEach((id, i) => {
          const el = document.getElementById(id);
          el.className = "step" + (i < n ? " done" : i === n ? " active" : "");
        });
      }

      window.doRegister = async function () {
        const name = document.getElementById("displayName").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (!name || !email || !password) {
          showMsg("Please fill in all fields.");
          return;
        }
        if (password !== confirm) {
          showMsg("Passwords do not match.");
          return;
        }
        if (password.length < 6) {
          showMsg("Password must be at least 6 characters.");
          return;
        }

        setBtn(true);
        try {
          // 1. Create Firebase user
          const cred = await createUserWithEmailAndPassword(
            auth,
            email,
            password,
          );
          _registeredUser = cred.user;

          // 2. Set display name
          await updateProfile(_registeredUser, { displayName: name });

          // 3. Send verification email
          await sendEmailVerification(_registeredUser);
          setStep(1);

          // 4. Register in backend (create pending record)
          const token = await _registeredUser.getIdToken();
          await fetch("/api/register-user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              uid: _registeredUser.uid,
              email: _registeredUser.email,
              displayName: name,
            }),
          });
          setStep(2);

          // 5. Show verification screen
          document.getElementById("registerForm").style.display = "none";
          document.getElementById("sentTo").textContent = email;
          document.getElementById("verifyBox").style.display = "block";
          setStep(3);
        } catch (err) {
          const msgs = {
            "auth/email-already-in-use": "This email is already registered.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/weak-password":
              "Password is too weak. Use at least 6 characters.",
          };
          showMsg(msgs[err.code] || "Registration failed: " + err.message);
        }
        setBtn(false);
      };

      window.resendVerification = async function () {
        if (!_registeredUser) {
          alert("Please go back and register again.");
          return;
        }
        try {
          await sendEmailVerification(_registeredUser);
          alert("Verification email resent! Check your inbox.");
        } catch (e) {
          alert("Could not resend: " + e.message);
        }
      };

      window.goToLogin = function () {
        window.location.href = "/login";
      };

      // Enter key support
      document
        .getElementById("confirmPassword")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") window.doRegister();
        });
    </script>
  </body>
</html>
